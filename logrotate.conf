# Log rotation configuration for EV Charging Optimizer
# This file is for reference - macOS uses newsyslog instead of logrotate
# See DEPLOYMENT.md for macOS-specific log rotation setup

/Users/tomeldridge/ev-charging-optimizer/logs/*.log {
    # Rotate daily
    daily

    # Keep 14 days of logs
    rotate 14

    # Compress old logs
    compress
    delaycompress

    # Don't error if log file is missing
    missingok

    # Don't rotate empty logs
    notifempty

    # Create new log files with these permissions
    create 644 tomeldridge staff

    # Use date as suffix
    dateext
    dateformat -%Y%m%d

    # Shared script for all logs
    sharedscripts

    # No need to reload services after rotation
    postrotate
    endscript
}
