# EV Charging Optimizer Configuration
# Edit this file to customize your preferences

# User settings
user:
  postcode: "E1"              # Your postcode for carbon intensity data (deprecated)
  carbon_region_id: 13        # Carbon Intensity region ID (13 = London, see docs for others)
  region: "H"                 # Octopus Agile region (H = Southern England/London)
  charging_rate_kw: 2.3       # Your charger power rating in kW
  typical_charge_kwh: 20      # Typical charge amount in kWh

# Price and carbon thresholds (adjust based on observed data)
thresholds:
  price_excellent: 10         # pence/kWh - EXCELLENT threshold
  price_good: 15              # pence/kWh - GOOD threshold
  carbon_excellent: 100       # gCO2/kWh - EXCELLENT threshold
  carbon_good: 150            # gCO2/kWh - GOOD threshold

# Weighting between cost and carbon (must sum to 1.0)
preferences:
  price_weight: 0.6           # 60% weight on price
  carbon_weight: 0.4          # 40% weight on carbon

# Notification schedule
notifications:
  daily_time: "16:00"         # When to send daily recommendation
  reminder_time: "20:00"      # When to send evening reminder
  weekly_summary_time: "18:00"  # Sunday evening summary
  appliance_time: "06:00"     # Morning appliance planner
  max_per_day: 5              # Maximum notifications per day

# API configuration
apis:
  octopus:
    region: "H"
    product: "AGILE-24-10-01"
    tariff_code: "E-1R-AGILE-24-10-01-H"

  agile_predict:
    base_url: "https://prices.fly.dev"
    default_region: "H"               # H = Southern England / London
    days: 14
    high_low: true
    confidence_narrow_threshold: 5.0  # p/kWh band width = "high confidence"
    confidence_wide_threshold: 10.0   # p/kWh band width = "uncertain"

  forecast:
    url: "https://energy.guylipman.com/forecasts"
    update_interval_hours: 6

  carbon:
    base_url: "https://api.carbonintensity.org.uk"
    update_interval_hours: 12

  pushover:
    # Credentials loaded from .env file
    # PUSHOVER_USER_KEY and PUSHOVER_API_TOKEN
    sounds:
      excellent: "cashregister"
      good: "cosmic"
      reminder: "pushover"
      summary: "pushover"

# Data retention (days)
data_retention:
  forecast_history: 7
  recommendations: 30
  user_actions: 0  # 0 = keep forever
  logs: 14
  forecast_evolution: 30

# Forecast evolution tracking
forecast_evolution:
  enabled: true
  significant_change_threshold: 10  # % change to trigger alert
  retention_days: 30
  notify_on_change: true

# ACIX - Adaptive Charging Intelligence Extension
# Detects EV charging sessions from consumption data and provides behavioral insights
acix:
  enabled: true

  # EV Detection Settings
  ev_power_threshold_kw: 2.3    # Minimum power draw to consider as EV charging
  min_charging_intervals: 2      # Minimum consecutive intervals (30min each) to detect session

  # Arrival window estimation (for plug-in delay calculation)
  arrival_window:
    start: "18:00"               # Estimated earliest arrival time
    end: "20:00"                 # Estimated latest arrival time

  # Detection confidence
  detection_confidence_threshold: 60  # Minimum confidence score (0-100) to log session

  # Data retention
  usage_retention_days: 30       # How long to keep raw consumption data
  events_retention_days: 90      # How long to keep detected events
  sessions_retention_days: 90    # How long to keep aggregated sessions

# Google Calendar integration
# Publishes charging windows to a shared calendar for household visibility
google_calendar:
  enabled: true
  credentials_path: "config/google_credentials.json"
  calendar_id: "5e352d691fec771a9964a7efdea58f1e074b3c68c0d1f594e7663a125bf6bb54@group.calendar.google.com"

  # What to sync
  sync_daily: true          # Sync on daily notification (4 PM)
  show_all_days: true       # Show all 7 days of charging windows

  # Event settings
  reminders:
    - 60   # 1 hour before window starts
    - 15   # 15 minutes before window starts

  # Cleanup
  delete_past_events: true  # Auto-delete old events
  retention_days: 7         # Keep events for 7 days after they pass
